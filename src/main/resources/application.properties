spring.application.name=ParaQ Next
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/paraq;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=12MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=always
server.forward-headers-strategy=framework
spring.web.resources.cache.cachecontrol.no-cache=true
